name: CI — Chequeo automático

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TypeScript + ESLint + Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint (solo src — no bloquea por android/sw generados)
        run: pnpm exec eslint src --max-warnings 50

      - name: Validación PWA + Archivos críticos
        run: node scripts/validate.mjs

      - name: Build de producción
        run: pnpm build
        env:
          NEXT_PUBLIC_PLAN: pro
          NEXT_TELEMETRY_DISABLED: 1
          NEXTAUTH_SECRET: ci-placeholder
          # Placeholders — el build evalúa src/lib/supabase.ts al compilar
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_KEY: ci-placeholder-service-key
          SUBSCRIPTION_STATUS: active
