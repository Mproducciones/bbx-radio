name: CI — Chequeo automático

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TypeScript + QA + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_PLAN: pro
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_KEY: ci-placeholder-service-key
      SUBSCRIPTION_STATUS: active
      NEXT_PUBLIC_SANITY_PROJECT_ID: nmwhp66x
      NEXT_PUBLIC_SANITY_DATASET: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: npx tsc --noEmit

      - name: QA agente (validate + build de producción)
        run: pnpm run agent:qa
