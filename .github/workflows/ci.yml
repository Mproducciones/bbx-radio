name: CI — Chequeo automático

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TypeScript + ESLint + Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: pnpm lint --max-warnings 0

      - name: Validación PWA + Archivos críticos
        run: node scripts/validate.mjs

      - name: Build de producción
        run: pnpm build
        env:
          # Variables mínimas para que Next.js compile sin error de runtime
          NEXT_PUBLIC_PLAN: pro
          NEXT_TELEMETRY_DISABLED: 1
          # Secrets opcionales — el build no falla sin ellos
          NEXTAUTH_SECRET: ci-placeholder
